# 千兆 WAN 稳态调优（2026-11-02 实测：8 线程 826~852 Mbps，sirq 接近 0）
# 用户自定义项应写在本文件，不要写 /etc/sysctl.d/（那个目录默认不备份，重新刷机会丢）

# conntrack 上限（默认 4096，30+ 设备并发 + 下载场景不够）
net.netfilter.nf_conntrack_max=8192

# TCP 收发缓冲上限 16MB（BDP 参考：1Gbps × 40ms ≈ 5MB，留 3 倍余量）
net.core.rmem_max=16777216
net.core.wmem_max=16777216
net.ipv4.tcp_rmem=4096 131072 16777216
net.ipv4.tcp_wmem=4096 65536 16777216

# 空闲后不重置拥塞窗口，避免间歇流量每次都从慢启动开始
net.ipv4.tcp_slow_start_after_idle=0

# 硬件 offload 的流表老化时间（默认 tcp 600s 偏长，白占 flowtable 表项）
net.netfilter.nf_flowtable_tcp_timeout=120
net.netfilter.nf_flowtable_udp_timeout=60
